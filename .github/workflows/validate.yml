name: Validate reader projects
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubicloud-standard-2
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - project: browser-task-to-playwright-test
            node: '24'
          - project: save-failed-playwright-test
            node: '24'
          - project: test-dark-mode-reduced-motion
            node: '24'
          - project: first-agent-task
            node: '24'
          - project: playwright-within-table-cells
            node: '24'
          - project: parallel-playwright-account-data
            node: '26.13.0'
    defaults:
      run:
        working-directory: posts/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: posts/${{ matrix.project }}/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: matrix.project != 'first-agent-task'
      - run: npm run verify
